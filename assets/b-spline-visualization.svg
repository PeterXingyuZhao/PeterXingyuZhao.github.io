<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
<title id="title">A cubic B-spline and its basis functions</title>
<desc id="desc">The demo's degree-three preset has four control points and the clamped knot vector 0,0,0,0,1,1,1,1. The upper plot shows the curve and an explanatory dashed control polygon. The lower plot shows its four Bernstein basis functions. Matching colors connect each control point to its basis function.</desc>
<!-- Affine image of the source preset: (50,200), (350,400), (650,200), (950,400).
     With knots [0,0,0,0,1,1,1,1], the cubic B-spline is a cubic Bezier curve.
     B = [(1-u)^3, 3u(1-u)^2, 3u^2(1-u), u^3]. -->
<rect width="600" height="400" fill="#f8faf9"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="32" y="42" fill="#202a27" font-size="25" font-weight="600">Cubic B-spline</text>
<text x="568" y="42" text-anchor="end" fill="#606c66" font-size="20">degree 3</text>
<path d="M50 100 L216.667 200 L383.333 100 L550 200" fill="none" stroke="#b5bfb9" stroke-width="2.5" stroke-dasharray="7 7"/>
<path d="M50 100 C216.667 200 383.333 100 550 200" fill="none" stroke="#202a27" stroke-width="5" stroke-linecap="round"/>
<g stroke="#fff" stroke-width="3">
<circle cx="50" cy="100" r="8" fill="#25624d"/><circle cx="216.667" cy="200" r="8" fill="#456a97"/>
<circle cx="383.333" cy="100" r="8" fill="#a86e32"/><circle cx="550" cy="200" r="8" fill="#8a6b9b"/>
</g>
<g fill="#606c66" font-size="20">
<text x="50" y="82" text-anchor="middle">P₀</text><text x="216.667" y="227" text-anchor="middle">P₁</text>
<text x="383.333" y="82" text-anchor="middle">P₂</text><text x="550" y="227" text-anchor="middle">P₃</text>
</g>
<path d="M32 247 H568" stroke="#dfe5e1"/>
<text x="300" y="277" text-anchor="middle" fill="#606c66" font-size="21">Basis functions</text>
<path d="M50 295 V350 H550 M550 350 V295" fill="none" stroke="#dfe5e1" stroke-width="2"/>
