<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title description">
  <title id="title">Study room reservation workflow</title>
  <desc id="description">An illustrated booking workflow with example data: choose October 20 from 10:00 to 12:00, filter for a projector, choose available room A201 with capacity 24, and reserve it. A check marks the reservation confirmation.</desc>
  <rect x="1" y="1" width="598" height="398" rx="10" fill="#f5f7f5" stroke="#dfe5e1" stroke-width="2"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" fill="#202a27">
    <text x="28" y="44" font-size="26" font-weight="600">Find a room. Make a booking.</text>

    <rect x="28" y="68" width="544" height="50" rx="5" fill="#ffffff" stroke="#dfe5e1" stroke-width="2"/>
    <text x="46" y="100" font-size="20" fill="#606c66">Date &amp; time</text>
    <text x="224" y="100" font-size="21">Oct 20 · 10:00–12:00</text>
    <path d="m539 90 7 7 7-7" fill="none" stroke="#606c66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="28" y="132" width="544" height="50" rx="5" fill="#ffffff" stroke="#dfe5e1" stroke-width="2"/>
    <text x="46" y="164" font-size="20" fill="#606c66">Equipment</text>
    <text x="224" y="164" font-size="21">Projector</text>
    <g fill="none" stroke="#606c66" stroke-width="2" stroke-linecap="round">
      <circle cx="542" cy="154" r="7"/>
      <path d="m547 160 7 7"/>
    </g>

    <text x="28" y="218" font-size="22" font-weight="600">Available rooms</text>
    <rect x="28" y="232" width="544" height="92" rx="5" fill="#ffffff" stroke="#dfe5e1" stroke-width="2"/>
    <path d="M28 270h544" fill="none" stroke="#dfe5e1" stroke-width="2"/>
    <g font-size="20" fill="#606c66">
      <text x="46" y="258">Room</text>
      <text x="221" y="258">Capacity</text>
    </g>
    <text x="46" y="306" font-size="23" font-weight="500">A201</text>
    <text x="221" y="306" font-size="23">24</text>
    <rect x="425" y="280" width="128" height="34" rx="4" fill="#25624d"/>
    <text x="489" y="304" font-size="20" font-weight="500" fill="#ffffff" text-anchor="middle">Reserve</text>

    <path d="M489 324v17" fill="none" stroke="#25624d" stroke-width="2"/>
    <path d="m484 336 5 5 5-5" fill="none" stroke="#25624d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="28" y="348" width="544" height="36" rx="5" fill="#edf3ee"/>
    <path d="m47 365 6 6 11-12" fill="none" stroke="#25624d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="78" y="373" font-size="21" font-weight="500" fill="#25624d">Reservation confirmed</text>
  </g>
</svg>
